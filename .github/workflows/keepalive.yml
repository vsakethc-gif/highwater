# Keep the free Supabase project awake.
# Supabase pauses free projects after 7 days without activity, which would break
# community reports during judging. Every 3 days this reads one public report row.
# It uses only PUBLIC values (the same ones the website uses), stored as repository
# variables: Settings → Secrets and variables → Actions → Variables.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *' # 9:17 UTC every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Read one public row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ vars.SUPABASE_URL }}/rest/v1/reports?select=id&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
